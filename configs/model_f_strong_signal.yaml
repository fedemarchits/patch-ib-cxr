experiment_name: "model_f_strong_signal"

data:
  json_path: "/workspace/mimic_master_official_split.jsonl"
  image_root: "/datasets/MIMIC-CXR/files"
  batch_size: 48
  num_workers: 4
  image_size: 224
  text_sections: "findings_impression"

model:
  vision_backbone: "hf-hub:microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224"
  text_backbone: "hf-hub:microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224"

  # Model F-strong: same architecture as F-layer6 (k=0.5) but with a stronger
  # dropped-path contrastive signal (contrastive_full_weight 0.5 → 1.0).
  #
  # Rationale: F-layer6 already has the best purity (0.4645) across all models.
  # The dropped-path CLS (text-conditioned, trained with weight=0.5) is what
  # shapes the backbone to attend to FILIP-selected patches. Doubling this weight
  # pushes the backbone harder via the 98-patch dropped path, potentially
  # improving purity further without affecting encode_independent retrieval
  # (the full CLS path is unaffected at evaluation).
  #
  # If purity rises past 0.48 this confirms that the dropped-path contrastive
  # is the key driver of clustering structure in the F family.
  use_filip_drop: true

  drop_layer: 6

  k_ratio: 0.5
  k_ratio_start: 0.75
  k_ratio_anneal_steps: 5000

  use_filip_final: true
  mid_fusion_loss_weights: [0.3, 0.3]
  mid_fusion_warmup_steps: 500

  sparsity_weight: 0.0

  # Key change: dropped-path contrastive weight 0.5 → 1.0.
  # Now equal weight to main (full-CLS) contrastive.
  # The backbone receives equally strong gradient from both paths.
  contrastive_mask_weight: 1.0
  contrastive_full_weight: 1.0

training:
  staged_training: true
  warmup_epochs: 1
  warmup_lr: 1.0e-4

  early_stopping_metric: "combined"

  combined_weights:
    recall: 0.7
    auc: 0.3

  eval_auc_every: 1

  epochs: 40
  lr: 1.0e-5
  weight_decay: 0.02
  warmup_steps: 1000
  early_stopping_patience: 6
  print_freq: 50
  device: "cuda"
  use_amp: true
  gradient_accumulation_steps: 4
  freeze_backbone: false
  llrd_factor: 0.85

wandb:
  enable: true
  project: "Thesis-PatchIB"
  run_name: "model-f-strong-signal"
